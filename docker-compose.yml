services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: friday_events
      POSTGRES_USER: friday
      POSTGRES_PASSWORD: friday
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friday -d friday_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # Apply migrations, then start the app
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "change-me-local-docker-only"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: friday_events
      PGUSER: friday
      PGPASSWORD: friday
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema/')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
